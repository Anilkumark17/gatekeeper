name: release
on:
  push:
    tags: ['v*']
jobs:
  vsix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run build
      - run: npx @vscode/vsce package --no-dependencies --allow-missing-repository -o gatekeeper.vsix
        working-directory: packages/vscode
      - uses: softprops/action-gh-release@v2
        with: { files: packages/vscode/gatekeeper.vsix }
      # Auto-update for users needs a Marketplace listing. Skipped until the token secrets exist.
      - if: ${{ secrets.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --packagePath gatekeeper.vsix --no-dependencies
        working-directory: packages/vscode
        env: { VSCE_PAT: '${{ secrets.VSCE_PAT }}' }
